<div class="admin-panel">
    <aside class="sidebar">
        @if (currentUser(); as user) {
        <div class="sidebar-identity">
            <app-avatar [role]="user.role" [name]="user.adSoyad"></app-avatar>
            <div>
                <p class="sidebar-name">{{ user.adSoyad }}</p>
                <p class="sidebar-role">Sistem yöneticisi</p>
            </div>
        </div>
        }

        <nav class="sidebar-nav">
            <a class="sidebar-link" routerLink="/admin-panel/dashboard" routerLinkActive="active">
                Dashboard
            </a>
            <a class="sidebar-link" routerLink="/admin-panel/resources" routerLinkActive="active">
                Kaynaklar
            </a>
            <a class="sidebar-link" routerLink="/admin-panel/recurring-schedule" routerLinkActive="active">
                Ders programı
            </a>
            <a class="sidebar-link" routerLink="/admin-panel/users" routerLinkActive="active">
                Kullanıcılar
            </a>
            <a class="sidebar-link" routerLink="/admin-panel/system-settings" routerLinkActive="active">
                Sistem Ayarları
            </a>
            <a class="sidebar-link" routerLink="/admin-panel/notifications" routerLinkActive="active">
                Bildirimler
                @if (unreadCount() > 0) {
                <span class="badge-count">{{ unreadCount() }}</span>
                }
            </a>
            <a class="sidebar-link" routerLink="/admin-panel/profile" routerLinkActive="active">
                Profil
            </a>
        </nav>
    </aside>

    <main class="panel-content">
        <router-outlet></router-outlet>
    </main>
</div>
