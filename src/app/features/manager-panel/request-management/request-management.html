<div class="request-management">
    <h1>Talep Yönetimi</h1>

    @if (isLoading()) {
    <p class="empty-state">Yükleniyor...</p>
    } @else if (pendingBookings().length === 0) {
    <p class="empty-state">Bekleyen talep yok.</p>
    } @else {
    <div class="requests-list">
        @for (booking of pendingBookings(); track booking.id) {
        <app-card>
            <div class="request-row">
                <div class="request-info">
                    <app-badge variant="warning">Bekliyor</app-badge>
                    <p class="request-purpose">{{ booking.purpose }}</p>
                    <p class="request-date">{{ booking.date }}</p>
                </div>

                <div class="request-actions">
                    <app-button variant="success" (buttonClick)="approve(booking)">Onayla</app-button>
                    <app-button variant="danger" (buttonClick)="openRejectModal(booking)">Reddet</app-button>
                </div>
            </div>
        </app-card>
        }
    </div>
    }
</div>

<app-reject-modal [open]="rejectingBookingId() !== null" [errorMessage]="rejectServiceError()"
    (confirmReject)="handleRejectConfirm($event)" (cancel)="closeRejectModal()"></app-reject-modal>
