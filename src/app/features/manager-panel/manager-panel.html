<div class="manager-panel">
    <aside class="sidebar">
        @if (currentUser(); as user) {
        <div class="sidebar-identity">
            <app-avatar [role]="user.role" [name]="user.adSoyad"></app-avatar>
            <div>
                <p class="sidebar-name">{{ user.adSoyad }}</p>
                <p class="sidebar-role">Yönetici</p>
            </div>
        </div>
        }

        <nav class="sidebar-nav">
            <a class="sidebar-link" routerLink="/manager-panel/requests" routerLinkActive="active">
                Talep Yönetimi
            </a>
            <a class="sidebar-link" routerLink="/manager-panel/resources" routerLinkActive="active">
                Bölüm Kaynakları Durumu
            </a>
            <a class="sidebar-link" routerLink="/manager-panel/notifications" routerLinkActive="active">
                Bildirimler
                @if (unreadCount() > 0) {
                <span class="badge-count">{{ unreadCount() }}</span>
                }
            </a>
            <a class="sidebar-link" routerLink="/manager-panel/profile" routerLinkActive="active">
                Profil
            </a>
        </nav>
    </aside>

    <main class="panel-content">
        <router-outlet></router-outlet>
    </main>
</div>

<app-lock-modal [urgentBooking]="currentUrgentBooking" [currentIndex]="urgentIndex() + 1"
    [totalCount]="urgentBookings().length" (approve)="handleUrgentApprove($event)"
    (reject)="openUrgentReject($event)"></app-lock-modal>

<app-reject-modal [open]="rejectingUrgentBookingId() !== null" [errorMessage]="urgentRejectError()"
    (confirmReject)="handleUrgentRejectConfirm($event)"
    (cancel)="rejectingUrgentBookingId.set(null)"></app-reject-modal>
